<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HOL Light benchmark results">
  <title>HOL Light benchmark results</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>HOL Light benchmark results</h1>
      <div class="header-actions">
        <label class="run-picker" for="run-select">
          <span>Published run</span>
          <select id="run-select" disabled>
            <option>Loading runs…</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <main>
    <div id="notice" class="notice" role="status" hidden></div>

    <section id="dashboard" hidden>
      <div id="run-heading" class="run-heading"></div>
      <div id="metadata" class="metadata-grid"></div>

      <section aria-labelledby="summary-title">
        <div class="section-heading">
          <h2 id="summary-title">Summary</h2>
          <div id="overall" class="overall"></div>
        </div>
        <div id="summary-cards" class="summary-grid"></div>
      </section>

      <section class="results-section" aria-labelledby="results-title">
        <div class="section-heading results-heading">
          <h2 id="results-title">Tests</h2>
          <div class="filters">
            <div class="fold-controls" aria-label="Suite row controls">
              <button id="expand-all" type="button">Expand all</button>
              <button id="collapse-all" type="button">Collapse all</button>
            </div>
            <label class="search-field">
              <span class="sr-only">Search tests</span>
              <input id="search" type="search" placeholder="Search tests">
            </label>
            <label>
              <span class="sr-only">Filter by status</span>
              <select id="status-filter">
                <option value="all">All statuses</option>
                <option value="fail">Failed</option>
                <option value="missing">Missing</option>
                <option value="skip">Skipped</option>
                <option value="pass">Passed</option>
              </select>
            </label>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Suite</th>
                <th>Test</th>
                <th>Status</th>
                <th class="numeric">Elapsed</th>
                <th>Proof output</th>
              </tr>
            </thead>
            <tbody id="results-body"></tbody>
          </table>
          <div id="empty-results" class="empty-results" hidden>No tests match these filters.</div>
        </div>
        <p id="result-count" class="result-count"></p>
      </section>
    </section>

    <section id="empty-state" class="empty-state">
      <h2>No results loaded</h2>
      <p>Select a published run above.</p>
    </section>
  </main>

  <footer>
    Static benchmark report viewer.
  </footer>

  <script src="embedded-runs.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
